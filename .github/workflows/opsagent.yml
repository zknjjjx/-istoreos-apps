name: luci-app-opsagent

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 1.0.0-r1'
        required: true
        default: '1.0.0-r1'
  push:
    tags: ['opsagent-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 版本号
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#opsagent-v}"
          echo "V=$V" >> $GITHUB_ENV
      - name: 自检
        run: |
          pip install -q websockets
          cd luci-app-opsagent
          python3 -m py_compile root/usr/share/opsagent/agent.py
          OPSAGENT_NOSYSLOG=1 timeout 60 python3 test/mock-agent.py
      - name: 打包
        run: |
          cd luci-app-opsagent
          sudo sh build/build-apk.sh "$V"
          ls -la dist
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opsagent-v${{ env.V }}
          name: luci-app-opsagent ${{ env.V }}
          body: |
            AI 运维助手：在飞书里用大白话管理 iStoreOS 路由器（DeepSeek 驱动，飞书长连接，无需公网 IP）。
            适用于新版 iStoreOS / OpenWrt 25.12+（apk 包管理器），所有架构通用（-all.apk）。
            依赖 python3、python3-websockets，安装时会自动从软件源拉取（约 20 MB）。
            安装：iStore → 手动安装 → 上传 apk；或 `apk add --allow-untrusted luci-app-opsagent-*.apk`
          files: luci-app-opsagent/dist/*.apk
